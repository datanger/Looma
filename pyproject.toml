[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "looma-runtime"
version = "0.1.4"
description = "Python runtime for Agent-Embedded Programming: embed host coding agents into ordinary resumable Python control flow without adding another LLM API client."
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "datanger"}]
keywords = ["agent-embedded-programming", "agents", "workflow", "durable-execution", "codex", "python"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]

[project.urls]
Homepage = "https://github.com/datanger/Looma"
Repository = "https://github.com/datanger/Looma"
Documentation = "https://github.com/datanger/Looma#readme"

[project.scripts]
looma = "looma.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
looma = ["skills/*/SKILL.md"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
