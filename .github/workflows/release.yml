name: release-wheel

on:
  workflow_dispatch:
  push:
    paths:
      - "release/VERSION"

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - id: version
        name: Read version
        shell: bash
        run: |
          VERSION="$(tr -d '[:space:]' < release/VERSION)"
          if [ -z "$VERSION" ]; then
            echo "release/VERSION is empty" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Verify package version
        shell: bash
        run: |
          PACKAGE_VERSION="$(python - <<'PY'
          import tomllib
          with open("pyproject.toml", "rb") as f:
              print(tomllib.load(f)["project"]["version"])
          PY
          )"
          if [ "$PACKAGE_VERSION" != "${{ steps.version.outputs.version }}" ]; then
            echo "pyproject.toml version ($PACKAGE_VERSION) does not match release/VERSION (${{ steps.version.outputs.version }})" >&2
            exit 1
          fi

      - run: python -m pip install --upgrade pip build pytest
      - run: python -m pip install -e .
      - run: pytest
      - run: python -m build --wheel

      - name: Create GitHub Release and upload wheel
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Looma v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          body_path: release/RELEASE_NOTES.md
          files: dist/*.whl
