name: research-arag-data

on:
  workflow_dispatch:
  push:
    paths:
      - "experiments/case_studies/arag_host_native/prepare_public_data.py"
      - "experiments/case_studies/arag_host_native/freeze_subset.py"
      - ".github/workflows/research-arag-data.yml"

jobs:
  freeze-public-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: python -m pip install --upgrade pip huggingface_hub

      - name: Download pinned A-RAG public benchmark files
        run: |
          python -m experiments.case_studies.arag_host_native.prepare_public_data             --revision b9198a5a8702cc35c6df7542529357a9af95d928             --subset-size 100             --seed aep-paper-v1             --output-root research-data/arag

      - name: Show frozen manifest
        run: cat research-data/arag/manifest.json

      - uses: actions/upload-artifact@v4
        with:
          name: aep-arag-public-dev100
          path: research-data/arag/
          retention-days: 90
