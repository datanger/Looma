name: research-retrieval-perturbation

on:
  workflow_dispatch:
  push:
    paths:
      - "experiments/workloads/retrieval_perturbation/**"
      - "experiments/case_studies/arag_host_native/prepare_public_data.py"
      - "research/RETRIEVAL_PERTURBATION_PROTOCOL.md"
      - ".github/workflows/research-retrieval-perturbation.yml"

jobs:
  control-flow-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e . pytest
      - name: Control-flow tests on the fixture corpus
        run: python -m pytest tests/test_retrieval_perturbation.py
      - name: The runner must refuse a fixture corpus as a public result
        run: |
          if python -m experiments.workloads.retrieval_perturbation.run_perturbation \
              --data-root experiments/workloads/retrieval_perturbation/fixtures \
              --datasets fixture \
              --expect-public; then
            echo "expected the runner to refuse a fixture corpus" >&2
            exit 1
          fi

  public-perturbation-comparison:
    runs-on: ubuntu-latest
    needs: control-flow-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e . huggingface_hub
      - name: Download and freeze the pinned public benchmark data
        run: |
          python -m experiments.case_studies.arag_host_native.prepare_public_data \
            --revision b9198a5a8702cc35c6df7542529357a9af95d928 \
            --subset-size 100 \
            --seed aep-paper-v1 \
            --output-root research-data/arag
      - name: Run the retrieval-perturbation comparison on public instances
        run: |
          mkdir -p research-results
          python -m experiments.workloads.retrieval_perturbation.run_perturbation \
            --data-root research-data/arag \
            --datasets musique,hotpotqa,2wikimultihop \
            --paradigms direct_sdk,looma \
            --expect-public \
            --output research-results/rq2-retrieval-perturbation.json
      - name: Record the public data manifest next to the results
        run: cp research-data/arag/manifest.json research-results/arag-public-data-manifest.json
      - name: Report headline numbers
        run: |
          python - <<'PY'
          import json
          payload = json.load(open("research-results/rq2-retrieval-perturbation.json"))
          assert payload["mode"] == "public", payload["mode"]
          print("mode:", payload["mode"])
          for row in payload["table"]:
              print(
                  row["implementation"], row["routes_mode"], row["dataset"],
                  "dev", row["adaptive_success_dev"],
                  "eval", row["adaptive_success_eval"],
                  "gaps", row["eval_route_gaps"],
                  "sloc_delta", row["route_declaration_delta_sloc"],
              )
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: aep-rq2-retrieval-perturbation
          path: research-results/
          retention-days: 90