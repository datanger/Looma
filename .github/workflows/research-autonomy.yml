name: research-autonomy

on:
  workflow_dispatch:
  push:
    paths:
      - "experiments/workloads/bounded_autonomy/**"
      - "research/BOUNDED_AUTONOMY_PROTOCOL.md"
      - ".github/workflows/research-autonomy.yml"

jobs:
  perturbation-sanity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - name: Validate perturbation suite
        run: |
          mkdir -p research-results
          python -m experiments.workloads.bounded_autonomy.sanity \
            --output research-results/bounded-autonomy-sanity.json
      - uses: actions/upload-artifact@v4
        with:
          name: aep-bounded-autonomy-sanity
          path: research-results/bounded-autonomy-sanity.json

  controlled-comparison:
    runs-on: ubuntu-latest
    needs: perturbation-sanity
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e . pytest
      - name: Install pinned baseline frameworks
        run: python -m pip install -r experiments/requirements-phase1.txt
      - name: Run the four-paradigm controlled perturbation comparison
        run: |
          mkdir -p research-results
          python -m experiments.workloads.bounded_autonomy.controlled.run_controlled \
            --output research-results/rq2-controlled.json
      - name: Regression tests for the controlled comparison
        run: python -m pytest tests/test_bounded_autonomy.py tests/test_bounded_autonomy_controlled.py
      - uses: actions/upload-artifact@v4
        with:
          name: aep-rq2-controlled
          path: research-results/rq2-controlled.json